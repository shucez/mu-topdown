# Build the static Shinylive site and publish it on GitHub Pages
# (https://shucez.github.io/mu-topdown/) on every push to main.
# build_site.R runs the validation tests first and stops if any fail, so a
# failing check never reaches the site.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits for the running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true   # binary packages, so installs take seconds

      - name: Install R packages
        run: Rscript -e 'install.packages(c("shinylive", "shiny", "bslib", "rhandsontable", "jsonlite", "readxl", "writexl"))'

      - name: Run tests and build the site
        run: Rscript build_site.R

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
